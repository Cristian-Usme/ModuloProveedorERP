# Server
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# Environment
spring.profiles.active=${ENVIRONMENT:dev}
spring.application.name=gestion-proveedores

# DataSource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gestion_proveedores}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:upb_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:upb_pass_2026}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=false

# Logging
logging.level.root=INFO
logging.level.com.upb.gestionproveedores=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.max-size=10MB
logging.file.max-history=10

# Jackson
spring.jackson.serialization.indent-output=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Security
jwt.secret=${JWT_SECRET:c2lzdGVtYUVtcHJlc2FyaWFsVVBCMjAyNlNlY3JldEtleUZvckpXVEF1dGhlbnRpY2F0aW9u}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# JWT
jwt.secret=c2lzdGVtYUVtcHJlc2FyaWFsVVBCMjAyNlNlY3JldEtleUZvckpXVEF1dGhlbnRpY2F0aW9u
jwt.expiration=86400000

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true

# Logging
logging.level.com.upb.gestionproveedores=DEBUG
logging.level.org.springframework.security=INFO
